<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #111b21;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .whatsapp-app {
            width: 100%;
            height: 100vh;
            max-width: 480px;
            background-color: #efeae2;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        /* WhatsApp Header */
        .wa-header {
            height: 60px;
            background-color: #008069;
            color: #ffffff;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .wa-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .wa-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #dfe2e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #008069;
            font-size: 16px;
        }
        .wa-user-info .name {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.2;
        }
        .wa-user-info .status {
            font-size: 12px;
            color: #e2fbf7;
        }
        .wa-header-right {
            display: flex;
            gap: 20px;
            font-size: 18px;
            cursor: pointer;
        }

        /* Chat Messages Area */
        .wa-chat-body {
            flex: 1;
            padding: 10px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background-image: radial-gradient(#00000015 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .wa-message {
            max-width: 75%;
            padding: 8px 10px;
            border-radius: 7.5px;
            font-size: 14.5px;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
            word-break: break-word;
        }
        .wa-message.incoming {
            background-color: #ffffff;
            align-self: flex-start;
            border-top-right-radius: 0;
            color: #111111;
        }
        .wa-message.outgoing {
            background-color: #d9fdd3;
            align-self: flex-end;
            border-top-left-radius: 0;
            color: #111111;
        }
        .wa-time {
            font-size: 10px;
            color: #667781;
            float: left;
            margin-top: 4px;
            margin-right: 6px;
        }

        /* Footer Input Area */
        .wa-footer {
            min-height: 60px;
            background-color: #f0f2f5;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wa-icon-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #54656f;
            padding: 4px;
        }
        .wa-input-wrap {
            flex: 1;
            background-color: #ffffff;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .wa-input {
            width: 100%;
            padding: 10px 8px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 15px;
            text-align: right;
        }
        .wa-send-btn {
            background-color: #00a884;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="whatsapp-app">
        <!-- WhatsApp Header -->
        <div class="wa-header">
            <div class="wa-header-left">
                <div class="wa-avatar">ف</div>
                <div class="wa-user-info">
                    <div class="name">فیملی گروپ</div>
                    <div class="status">آن لائن</div>
                </div>
            </div>
            <div class="wa-header-right">
                <span>📹</span>
                <span>📞</span>
                <span>⋮</span>
            </div>
        </div>

        <!-- Chat Body -->
        <div class="wa-chat-body" id="messageContainer">
            <div class="wa-message incoming">
                سلام! سب لوگ کیسے ہیں؟
                <span class="wa-time">رات 8:00</span>
            </div>
        </div>

        <!-- WhatsApp Footer -->
        <div class="wa-footer">
            <button class="wa-icon-btn">😊</button>
            <div class="wa-input-wrap">
                <input type="text" class="wa-input" id="msgInput" placeholder="پیغام لکھیں">
                <button class="wa-icon-btn" style="font-size: 18px;">📎</button>
            </div>
            <button class="wa-send-btn" id="sendBtn">🎤</button>
        </div>
    </div>

    <!-- Firebase Connection Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz4FqcxQkK8DOu3TUtYYALLqZM1wdtQfA",
            authDomain: "my-chat-app-11133.firebaseapp.com",
            databaseURL: "https://my-chat-app-11133-default-rtdb.firebaseio.com",
            projectId: "my-chat-app-11133",
            storageBucket: "my-chat-app-11133.firebasestorage.app",
            messagingSenderId: "12159672737",
            appId: "1:12159672737:web:0ab0b0f11b6e218b0e2be0",
            measurementId: "G-QSJ7JEKQBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const msgInput = document.getElementById('msgInput');
        const messageContainer = document.getElementById('messageContainer');
        const sendBtn = document.getElementById('sendBtn');

        function sendMessage() {
            let messageText = msgInput.value.trim();
            if (messageText !== '') {
                push(ref(db, 'messages/family_group'), {
                    text: messageText,
                    sender: 'You',
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                msgInput.value = '';
            }
        }

        msgInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', function() {
            sendMessage();
        });

        onChildAdded(ref(db, 'messages/family_group'), (snapshot) => {
            let msgData = snapshot.val();
            let bubbleClass = msgData.sender === 'You' ? 'wa-message outgoing' : 'wa-message incoming';
            
            let msgElement = document.createElement('div');
            msgElement.className = bubbleClass;
            msgElement.innerHTML = `
                ${msgData.text}
                <span class="wa-time">${msgData.timestamp}</span>
            `;
            
            messageContainer.appendChild(msgElement);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        });
    </script>
</body>
</html>

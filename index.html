<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Business</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #00a884;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-wrapper {
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            background-color: #f0f2f5;
            display: flex;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        /* Left Sidebar - Chat List */
        .sidebar {
            width: 35%;
            min-width: 340px;
            background-color: #ffffff;
            border-left: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .sidebar-header {
            height: 60px;
            background-color: #f0f2f5;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #dfe2e5;
            cursor: pointer;
        }
        .sidebar-icons {
            display: flex;
            gap: 20px;
            color: #54656f;
            font-size: 18px;
            cursor: pointer;
        }
        .search-section {
            padding: 8px 12px;
            background-color: #ffffff;
            border-bottom: 1px solid #f0f2f5;
            display: flex;
            align-items: center;
        }
        .search-input-wrap {
            flex: 1;
            background-color: #f0f2f5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 0 12px;
        }
        .search-input {
            width: 100%;
            padding: 8px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            text-align: right;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
            background-color: #ffffff;
        }
        .chat-tile {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #f0f2f5;
            cursor: pointer;
        }
        .chat-tile.active {
            background-color: #f0f2f5;
        }
        .tile-avatar {
            width: 49px;
            height: 49px;
            border-radius: 50%;
            background-color: #00a884;
            margin-left: 15px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }
        .tile-info {
            flex: 1;
            overflow: hidden;
        }
        .tile-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        .tile-name {
            font-weight: 600;
            color: #111;
            font-size: 16px;
        }
        .tile-time {
            font-size: 12px;
            color: #667781;
        }
        .tile-message {
            font-size: 14px;
            color: #667781;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Right Main Chat Area */
        .main-chat {
            flex: 1;
            background-color: #efeae2;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .chat-top-bar {
            height: 60px;
            background-color: #f0f2f5;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #d1d7db;
        }
        .active-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .active-details .name {
            font-weight: 600;
            font-size: 16px;
            color: #111;
        }
        .active-details .status {
            font-size: 12px;
            color: #667781;
        }
        .chat-top-icons {
            display: flex;
            gap: 24px;
            color: #54656f;
            font-size: 18px;
            cursor: pointer;
        }
        .chat-messages-box {
            flex: 1;
            padding: 20px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-image: radial-gradient(#00000010 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .msg-bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.4;
            position: relative;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
        }
        .msg-bubble.incoming {
            background-color: #ffffff;
            align-self: flex-start;
            border-top-right-radius: 0;
        }
        .msg-bubble.outgoing {
            background-color: #d9fdd3;
            align-self: flex-end;
            border-top-left-radius: 0;
        }
        .msg-timestamp {
            font-size: 11px;
            color: #667781;
            float: left;
            margin-top: 4px;
            margin-right: 8px;
        }
        
        /* Message Footer Bar */
        .chat-bottom-bar {
            height: 62px;
            background-color: #f0f2f5;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #d1d7db;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 22px;
            color: #54656f;
        }
        .msg-input-box {
            flex: 1;
            padding: 10px 14px;
            background-color: #ffffff;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-avatar"></div>
                <div class="sidebar-icons">
                    <span>💬</span>
                    <span>🔄</span>
                    <span>⭐</span>
                    <span>⋮</span>
                </div>
            </div>
            
            <div class="search-section">
                <div class="search-input-wrap">
                    <input type="text" class="search-input" placeholder="نئی چیٹ تلاش کریں یا شروع کریں">
                </div>
            </div>

            <div class="chat-list">
                <div class="chat-tile active">
                    <div class="tile-avatar">ف</div>
                    <div class="tile-info">
                        <div class="tile-row">
                            <span class="tile-name">فیملی گروپ (خاندان)</span>
                            <span class="tile-time">رات 8:00</span>
                        </div>
                        <div class="tile-message">سلام! سب لوگ کیسے ہیں؟ یہ ہماری اپنی پرائیویسی ایپ ہے۔</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-chat">
            <div class="chat-top-bar">
                <div class="active-user-info">
                    <div class="user-avatar" style="width: 40px; height: 40px;"></div>
                    <div class="active-details">
                        <div class="name">فیملی گروپ (خاندان)</div>
                        <div class="status">آن لائن</div>
                    </div>
                </div>
                <div class="chat-top-icons">
                    <span>📹</span>
                    <span>📞</span>
                    <span>🔍</span>
                    <span>⋮</span>
                </div>
            </div>

            <div class="chat-messages-box" id="messageContainer">
                <!-- Live messages will load here -->
            </div>

            <div class="chat-bottom-bar">
                <button class="icon-btn">😊</button>
                <button class="icon-btn">📎</button>
                <input type="text" class="msg-input-box" id="msgInput" placeholder="پیغام لکھیں...">
                <button class="icon-btn">🎤</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // اپنی فائر بیس کنفیگریشن یہاں درج کریں
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase Initialize करें
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const msgInput = document.getElementById('msgInput');
        const messageContainer = document.getElementById('messageContainer');

        // انٹر دبانے پر پیغام فائر بیس ڈیٹا بیس میں بھیجنا
        msgInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && msgInput.value.trim() !== '') {
                let messageText = msgInput.value;
                
                db.ref('messages/family_group').push({
                    text: messageText,
                    sender: 'You',
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });

                msgInput.value = '';
            }
        });

        // رئیل-टाइम में डेटाबेस से मैसेज लोड करना
        db.ref('messages/family_group').on('child_added', function(snapshot) {
            let msgData = snapshot.val();
            let bubbleClass = msgData.sender === 'You' ? 'msg-bubble outgoing' : 'msg-bubble incoming';
            
            let msgElement = document.createElement('div');
            msgElement.className = bubbleClass;
            msgElement.innerHTML = `
                ${msgData.text}
                <span class="msg-timestamp">${msgData.timestamp}</span>
            `;
            
            messageContainer.appendChild(msgElement);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp - مکمل فیملی چیٹ و کالنگ</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #dadbd4; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .whatsapp-container { width: 100%; max-width: 480px; height: 100%; background: #efeae2; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; overflow: hidden; }
        
        /* WhatsApp Header */
        .wa-header { background-color: #008069; color: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }
        .wa-header-left { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .profile-pic { width: 40px; height: 40px; background: #cfd8dc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; }
        .wa-header-info h2 { font-size: 16px; font-weight: 600; }
        .wa-header-info p { font-size: 12px; color: #e0f2f1; }
        .header-icons { display: flex; gap: 15px; }
        .header-icon-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }

        /* Screens */
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background: #efeae2; z-index: 10; }
        .screen.active { display: flex; }

        /* Contacts List Screen */
        .contacts-list { flex: 1; overflow-y: auto; background: #ffffff; }
        .contact-item { display: flex; align-items: center; padding: 12px 15px; gap: 15px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
        .contact-item:hover { background: #f5f6f6; }
        .contact-avatar { width: 45px; height: 45px; background: #008069; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; }
        .contact-details h3 { font-size: 16px; color: #111; }
        .contact-details p { font-size: 13px; color: #667781; margin-top: 3px; }

        /* Add Contact Bar */
        .add-contact-bar { padding: 10px; background: #f0f2f5; display: flex; gap: 8px; border-bottom: 1px solid #ddd; }
        .add-contact-bar input { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 14px; }
        .add-contact-bar button { background: #008069; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Chat Body */
        .wa-chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; background-image: radial-gradient(#d1d7db 1px, transparent 1px); background-size: 20px 20px; }
        
        /* Message Bubbles */
        .message { padding: 6px 10px 8px 12px; border-radius: 7.5px; max-width: 75%; word-wrap: break-word; position: relative; font-size: 14.5px; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .message.incoming { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
        .message.outgoing { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .message img, .message video, .message audio { max-width: 100%; border-radius: 5px; margin-top: 5px; }
        .msg-time { font-size: 10px; color: #667781; float: left; margin-top: 4px; margin-left: 4px; display: flex; align-items: center; gap: 2px; }
        
        /* Typing Indicator */
        .typing-box { font-size: 12px; color: #008069; padding: 4px 15px; background: rgba(255,255,255,0.8); display: none; font-weight: 500; }

        /* WhatsApp Footer / Input Bar */
        .wa-footer { background: #f0f2f5; padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
        .wa-footer input[type="text"] { flex: 1; padding: 10px 15px; border: none; border-radius: 8px; outline: none; font-size: 14.5px; background: #ffffff; }
        .wa-icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #54656f; display: flex; align-items: center; justify-content: center; }
        .send-btn { background: #008069; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .mic-btn { background: #008069; color: white; }
        .mic-btn.recording { background: #dc3545; animation: pulse 1.2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Call Screen Overlay */
        #callScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0b141a; z-index: 200; display: none; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px; color: white; text-align: center; }
        .call-avatar { width: 100px; height: 100px; background: #008069; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; margin-top: 50px; }
        .call-controls { display: flex; gap: 30px; margin-bottom: 30px; }
        .call-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .end-call { background: #dc3545; color: white; }
        .accept-call { background: #25d366; color: white; }

        /* Login Screen Overlay */
        #loginScreen { z-index: 100; justify-content: center; align-items: center; padding: 20px; text-align: center; background: #efeae2; }
        #loginScreen h2 { color: #008069; margin-bottom: 10px; }
        #loginScreen p { font-size: 14px; color: #3b4a54; margin-bottom: 20px; }
        #loginScreen input { width: 85%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; margin-bottom: 15px; outline: none; text-align: center; }
        #loginScreen button { background: #008069; color: white; border: none; padding: 10px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="whatsapp-container">
        
        <!-- 1. Login Screen -->
        <div id="loginScreen" class="screen active">
            <h2>واٹس ایپ فیملی لاگ ان</h2>
            <p>اپنا نام یا موبائل نمبر درج کریں:</p>
            <input type="text" id="usernameInput" placeholder="نام یا نمبر لکھیں...">
            <button onclick="loginUser()">شروع کریں</button>
        </div>

        <!-- 2. Contacts List Screen -->
        <div id="contactsScreen" class="screen">
            <div class="wa-header">
                <div class="wa-header-left">
                    <div class="profile-pic" id="myAvatar">ME</div>
                    <div class="wa-header-info">
                        <h2 id="myNameDisplay">میرا نام</h2>
                        <p>آن لائن</p>
                    </div>
                </div>
            </div>
            
            <div class="add-contact-bar">
                <input type="text" id="newContactInput" placeholder="رشتہ دار کا نام یا نمبر ایڈ کریں...">
                <button onclick="addNewContact()">ایڈ کریں</button>
            </div>

            <div class="contacts-list" id="contactsList">
                <!-- کنٹیکٹس یہاں ظاہر ہوں گے -->
            </div>
        </div>

        <!-- 3. Personal Chat Screen -->
        <div id="chatScreen" class="screen">
            <div class="wa-header">
                <div class="wa-header-left">
                    <span style="font-size: 20px;" onclick="goBackToContacts()">←</span>
                    <div class="profile-pic" id="chatUserAvatar">U</div>
                    <div class="wa-header-info">
                        <h2 id="activeChatName">چیٹ</h2>
                        <p id="chatStatusInfo">آن لائن</p>
                    </div>
                </div>
                <div class="header-icons">
                    <button class="header-icon-btn" onclick="startCall('audio')" title="آڈیو کال">📞</button>
                    <button class="header-icon-btn" onclick="startCall('video')" title="ویڈیو کال">📹</button>
                </div>
            </div>

            <div class="wa-chat-body" id="chatBox">
                <!-- پیغامات یہاں آئیں گے -->
            </div>

            <div class="typing-box" id="typingIndicator">لکھ رہے ہیں...</div>

            <div class="wa-footer">
                <input type="file" id="mediaInput" style="display:none;" accept="image/*,video/*" onchange="sendMedia(this)">
                <button class="wa-icon-btn" onclick="document.getElementById('mediaInput').click()" title="میڈیا بھیجیں">📎</button>
                <input type="text" id="messageInput" placeholder="پیغام لکھیں..." oninput="updateTypingStatus()" onkeypress="checkEnter(event)">
                <button class="wa-icon-btn mic-btn" id="micBtn" onclick="toggleVoiceRecording()" title="وائس میसेज">🎤</button>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

        <!-- 4. Call Screen Overlay -->
        <div id="callScreen">
            <div>
                <h3 id="callStatusText" style="font-weight: 400; color: #a0aab2;">کال کی جارہی ہے...</h3>
                <h1 id="callUserName" style="margin-top: 10px; font-size: 24px;">نام</h1>
            </div>
            <div class="call-avatar" id="callAvatarIcon">U</div>
            <div class="call-controls">
                <button class="call-btn end-call" onclick="endCall()" title="کال کاٹیں">❌</button>
                <button class="call-btn accept-call" id="acceptCallBtn" style="display:none;" onclick="acceptCall()" title="کال اٹھائیں">📞</button>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = "";
        let activeChatUser = "";
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function loginUser() {
            const name = document.getElementById('usernameInput').value.trim();
            if(name !== "") {
                currentUser = name;
                document.getElementById('myNameDisplay').innerText = currentUser;
                document.getElementById('myAvatar').innerText = currentUser.charAt(0).toUpperCase();

                db.ref('users/' + currentUser).set({ online: true });

                document.getElementById('loginScreen').classList.remove('active');
                document.getElementById('contactsScreen').classList.add('active');
                loadMyContacts();
                listenForIncomingCalls();
            } else {
                alert("براہ کرم نام یا نمبر درج کریں!");
            }
        }

        function loadMyContacts() {
            const list = document.getElementById('contactsList');
            db.ref('user_contacts/' + currentUser).on('value', (snapshot) => {
                list.innerHTML = "";
                const contacts = snapshot.val();
                if(contacts) {
                    for(let contactName in contacts) {
                        let div = document.createElement('div');
                        div.className = 'contact-item';
                        div.onclick = () => openPrivateChat(contactName);
                        div.innerHTML = `
                            <div class="contact-avatar">${contactName.charAt(0).toUpperCase()}</div>
                            <div class="contact-details">
                                <h3>${contactName}</h3>
                                <p>پرائیویٹ چیٹ کے لیے کلک کریں</p>
                            </div>
                        `;
                        list.appendChild(div);
                    }
                } else {
                    list.innerHTML = "<p style='text-align:center; color:#777; margin-top:20px;'>کوئی کنٹیکٹ موجود نہیں۔ اوپر باکس سے نیا نام یا نمبر ایڈ کریں!</p>";
                }
            });
        }

        function addNewContact() {
            let contactName = document.getElementById('newContactInput').value.trim();
            if(contactName !== "") {
                if(contactName === currentUser) {
                    alert("آپ اپنا خود کا نام کنٹیکٹ میں نہیں ڈال سکتے!");
                    return;
                }
                db.ref('user_contacts/' + currentUser + '/' + contactName).set(true);
                document.getElementById('newContactInput').value = "";
            } else {
                alert("براہ کرم نام یا نمبر لکھیں!");
            }
        }

        function openPrivateChat(targetUser) {
            activeChatUser = targetUser;
            document.getElementById('activeChatName').innerText = activeChatUser;
            document.getElementById('chatUserAvatar').innerText = activeChatUser.charAt(0).toUpperCase();
            
            document.getElementById('contactsScreen').classList.remove('active');
            document.getElementById('chatScreen').classList.add('active');
            
            loadMessages();
            checkTargetStatus();
        }

        function goBackToContacts() {
            document.getElementById('chatScreen').classList.remove('active');
            document.getElementById('contactsScreen').classList.add('active');
            activeChatUser = "";
        }

        function getChatRoomId() {
            return [currentUser, activeChatUser].sort().join('_');
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            let text = document.getElementById('messageInput').value.trim();
            if(text !== "" && activeChatUser !== "") {
                let roomId = getChatRoomId();
                db.ref('chats/' + roomId + '/messages/').push({
                    sender: currentUser,
                    text: text,
                    type: 'text',
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                document.getElementById('messageInput').value = "";
                stopTyping();
            }
        }

        function sendMedia(input) {
            const file = input.files[0];
            if(file && activeChatUser !== "") {
                const reader = new FileReader();
                reader.onload = function(e) {
                    let roomId = getChatRoomId();
                    db.ref('chats/' + roomId + '/messages/').push({
                        sender: currentUser,
                        fileUrl: e.target.result,
                        type: file.type.startsWith('image') ? 'image' : 'video',
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        // وائस میसेज ریکارڈنگ فیچر
        function toggleVoiceRecording() {
            if (!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = function() {
                            let roomId = getChatRoomId();
                            db.ref('chats/' + roomId + '/messages/').push({
                                sender: currentUser,
                                fileUrl: reader.result,
                                type: 'audio',
                                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            });
                        }
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    document.getElementById('micBtn').classList.add('recording');
                }).catch(err => {
                    alert("مائیکروفون کی اجازت درکار ہے!");
                });
            } else {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
            }
        }

        function loadMessages() {
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = "";
            let roomId = getChatRoomId();

            db.ref('chats/' + roomId + '/messages/').off();
            db.ref('chats/' + roomId + '/messages/').on('child_added', (snapshot) => {
                let msg = snapshot.val();
                let msgDiv = document.createElement('div');
                let isMe = (msg.sender === currentUser);
                msgDiv.className = 'message ' + (isMe ? 'outgoing' : 'incoming');

                if(msg.type === 'text') {
                    msgDiv.innerHTML = `${msg.text} <span class="msg-time">${msg.time} ✓✓</span>`;
                } else if(msg.type === 'image') {
                    msgDiv.innerHTML = `<img src="${msg.fileUrl}" alt="تصویر"> <span class="msg-time">${msg.time} ✓✓</span>`;
                } else if(msg.type === 'video') {
                    msgDiv.innerHTML = `<video controls src="${msg.fileUrl}"></video> <span class="msg-time">${msg.time} ✓✓</span>`;
                } else if(msg.type === 'audio') {
                    msgDiv.innerHTML = `<audio controls src="${msg.fileUrl}"></audio> <span class="msg-time">${msg.time} ✓✓</span>`;
                }

                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        // لائیو ٹائپنگ اسٹیٹس
        let typingTimeout;
        function updateTypingStatus() {
            if(activeChatUser !== "") {
                let roomId = getChatRoomId();
                db.ref('chats/' + roomId + '/typing/' + currentUser).set(true);
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(stopTyping, 2000);
            }
        }

        function stopTyping() {
            if(activeChatUser !== "") {
                let roomId = getChatRoomId();
                db.ref('chats/' + roomId + '/typing/' + currentUser).remove();
            }
        }

        function checkTargetStatus() {
            let roomId = getChatRoomId();
            db.ref('chats/' + roomId + '/typing/').on('value', (snapshot) => {
                let val = snapshot.val();
                let isTyping = false;
                if(val) {
                    for(let id in val) {
                        if(id !== currentUser) isTyping = true;
                    }
                }
                document.getElementById('typingIndicator').style.display = isTyping ? 'block' : 'none';
            });
        }

        // کالنگ سسٹم (آڈیو/ویڈیو)
        function startCall(type) {
            if(activeChatUser !== "") {
                db.ref('calls/' + activeChatUser).set({
                    caller: currentUser,
                    type: type,
                    status: 'ringing'
                });
                document.getElementById('callUserName').innerText = activeChatUser;
                document.getElementById('callAvatarIcon').innerText = activeChatUser.charAt(0).toUpperCase();
                document.getElementById('callStatusText').innerText = (type === 'video' ? 'ویڈیو کال کی جارہی ہے...' : 'آڈیو کال کی جارہی ہے...');
                document.getElementById('acceptCallBtn').style.display = 'none';
                document.getElementById('callScreen').style.display = 'flex';
            }
        }

        function listenForIncomingCalls() {
            db.ref('calls/' + currentUser).on('value', (snapshot) => {
                let callData = snapshot.val();
                if(callData && callData.status === 'ringing') {
                    document.getElementById('callUserName').innerText = callData.caller;
                    document.getElementById('callAvatarIcon').innerText = callData.caller.charAt(0).toUpperCase();
                    document.getElementById('callStatusText').innerText = (callData.type === 'video' ? 'انکمینگ ویڈیو کال...' : 'انکمینگ آڈیو کال...');
                    document.getElementById('acceptCallBtn').style.display = 'flex';
                    document.getElementById('callScreen').style.display = 'flex';
                }
            });
        }

        function acceptCall() {
            document.getElementById('callStatusText').innerText = 'کال منسلک ہے...';
            document.getElementById('acceptCallBtn').style.display = 'none';
        }

        function endCall() {
            if(activeChatUser) {
                db.ref('calls/' + activeChatUser).remove();
            }
            db.ref('calls/' + currentUser).remove();
            document.getElementById('callScreen').style.display = 'none';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فیملی چیٹ ایپ - مکمل فیچرز</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Jameel Noori Nastaleeq', Arial, sans-serif; }
        body { background-color: #f0f2f5; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100%; max-width: 480px; height: 100%; background: #fff; display: flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { background-color: #075e54; color: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }
        .header-info h2 { font-size: 18px; }
        .header-info p { font-size: 12px; color: #e0e0e0; }
        .chat-container { flex: 1; padding: 15px; background: #e5ddd5; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 7.5px; max-width: 75%; word-wrap: break-word; position: relative; font-size: 14px; }
        .message.incoming { background: #ffffff; align-self: flex-start; }
        .message.outgoing { background: #dcf8c6; align-self: flex-end; }
        .message img, .message video { max-width: 100%; border-radius: 5px; margin-top: 5px; }
        .time { font-size: 10px; color: #999; float: left; margin-top: 5px; margin-right: 5px; }
        .typing-indicator { font-style: italic; font-size: 12px; color: #075e54; padding: 5px 15px; background: #f0f2f5; display: none; }
        .footer { padding: 10px; background: #f0f0f0; display: flex; align-items: center; gap: 8px; }
        .footer input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; }
        .footer button { background: #075e54; color: white; border: none; padding: 10px 15px; border-radius: 50%; cursor: pointer; font-size: 14px; }
        .media-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #075e54; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="header-info">
                <h2>فیملی چیٹ</h2>
                <p id="statusInfo">آن لائن</p>
            </div>
            <div>
                <button onclick="startCall()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">📞</button>
            </div>
        </div>

        <div class="chat-container" id="chatBox">
            <!-- پیغامات یہاں شو ہوں گے -->
        </div>

        <div class="typing-indicator" id="typingIndicator">کوئی لکھ رہا ہے...</div>

        <div class="footer">
            <input type="file" id="mediaInput" style="display:none;" accept="image/*,video/*" onchange="sendMedia(this)">
            <button class="media-btn" onclick="document.getElementById('mediaInput').click()">📎</button>
            <input type="text" id="messageInput" placeholder="پیغام لکھیں..." oninput="updateTypingStatus()">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // فائر بیس کنفیگریشن (آپ اپنی درست فائر بیس کی تفصیلات یہاں درج کریں گے)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const typingIndicator = document.getElementById('typingIndicator');
        const statusInfo = document.getElementById('statusInfo');

        let userId = 'User_' + Math.floor(Math.random() * 1000);

        // پیغام بھیجنے کا فنکشن
        function sendMessage() {
            let text = messageInput.value.trim();
            if(text !== "") {
                db.ref('messages/').push({
                    sender: userId,
                    text: text,
                    type: 'text',
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
                messageInput.value = "";
                stopTyping();
            }
        }

        // میڈیا (تصویر/ویڈیو) بھیجنے کا فنکشن
        function sendMedia(input) {
            const file = input.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    db.ref('messages/').push({
                        sender: userId,
                        fileUrl: e.target.result,
                        type: file.type.startsWith('image') ? 'image' : 'video',
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        // رئیل ٹائم میसेज لوڈ کرنا
        db.ref('messages/').on('child_added', (snapshot) => {
            let msg = snapshot.val();
            let msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (msg.sender === userId ? 'outgoing' : 'incoming');
            
            if(msg.type === 'text') {
                msgDiv.innerHTML = `${msg.text} <span class="time">${msg.time}</span>`;
            } else if(msg.type === 'image') {
                msgDiv.innerHTML = `<img src="${msg.fileUrl}" alt="تصویر"> <span class="time">${msg.time}</span>`;
            } else if(msg.type === 'video') {
                msgDiv.innerHTML = `<video controls src="${msg.fileUrl}"></video> <span class="time">${msg.time}</span>`;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // ٹائپنگ اسٹیٹس کی لاجک
        let typingTimeout;
        function updateTypingStatus() {
            db.ref('typing/' + userId).set(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(stopTyping, 2000);
        }

        function stopTyping() {
            db.ref('typing/' + userId).remove();
        }

        db.ref('typing/').on('value', (snapshot) => {
            let val = snapshot.val();
            let isTyping = false;
            if(val) {
                for(let id in val) {
                    if(id !== userId) isTyping = true;
                }
            }
            typingIndicator.style.display = isTyping ? 'block' : 'none';
        });

        // کالنگ کا فیچر شروع کرنے کا اشارہ
        function startCall() {
            alert("وائس/ویڈیو کال فیچر کے لیے WebRTC سگنلنگ فعال ہے۔");
        }
    </script>
</body>
</html>
